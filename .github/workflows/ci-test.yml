name: CI Test

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v3
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cmake') }}-
            ccache-${{ runner.os }}-
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('test/clippy/requirements*.txt') }}
      - name: Display versions
        run: |
          cmake --version
          g++ --version
      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev ccache
      - name: Build and test
        run: |
          cd $GITHUB_WORKSPACE
          mkdir build
          cd build
          cmake ../ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DMETALLDATA_BUILD_TESTS=ON BOOST_FETCH_URL=https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2
          make -j6
          make test
      - name: end-to-end testing
        run: |
          cd $GITHUB_WORKSPACE/build
          # Cmake isn't finding the venv for some reason...
          # python3 -m venv venv
          # source venv/bin/activate
          python3 -m pip install -r ../test/clippy/requirements.txt -r ../test/clippy/requirements-dev.txt
          echo "inspecting"
          which python
          which python3
          make pytest
